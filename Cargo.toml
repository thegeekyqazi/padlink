[workspace]
resolver = "3"
members = ["crates/padlink", "crates/padlink-capture", "crates/padlink-config", "crates/padlink-encode", "crates/padlink-hypr", "crates/padlink-input", "crates/padlink-proto", "crates/padlink-usbmux", "crates/padlinkd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
padlink-capture = { path = "crates/padlink-capture" }
padlink-config = { path = "crates/padlink-config" }
padlink-encode = { path = "crates/padlink-encode" }
padlink-hypr = { path = "crates/padlink-hypr" }
padlink-input = { path = "crates/padlink-input" }
padlink-proto = { path = "crates/padlink-proto" }
padlink-usbmux = { path = "crates/padlink-usbmux" }
# OpenDisplay's protocol crates (GPL-3.0), pinned to a release tag (SPEC.md
# rule 4). Vendor them if upstream breaks.
opendisplay-proto = { git = "https://github.com/peetzweg/opendisplay", tag = "v1.30.3" }
opendisplay-session = { git = "https://github.com/peetzweg/opendisplay", tag = "v1.30.3" }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
# Raw FFmpeg bindings against the system libraries (FFmpeg 8).
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec", "avfilter", "swscale"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
signal-hook = "0.4"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
rustix = { version = "1", features = ["event", "fs", "time"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
